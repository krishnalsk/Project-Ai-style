<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CookSmart - Saved Recipes</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#221f1e",
                    "surface-bright": "#3c3837",
                    "on-primary-fixed": "#370e00",
                    "error": "#ffb4ab",
                    "primary": "#ffb599",
                    "on-surface-variant": "#e2bfb2",
                    "surface-container-highest": "#373433",
                    "on-primary-fixed-variant": "#7f2b00",
                    "outline-variant": "#5a4138",
                    "on-tertiary-fixed-variant": "#4b4641",
                    "primary-container": "#f66018",
                    "surface-dim": "#151312",
                    "on-tertiary-fixed": "#1f1b17",
                    "primary-fixed-dim": "#ffb599",
                    "surface-tint": "#ffb599",
                    "secondary-container": "#454747",
                    "error-container": "#93000a",
                    "surface-container-high": "#2c2928",
                    "secondary-fixed-dim": "#c6c6c7",
                    "surface-container-lowest": "#100e0d",
                    "outline": "#a98a7e",
                    "tertiary": "#cec5bf",
                    "surface-variant": "#373433",
                    "surface-container-low": "#1d1b1a",
                    "on-error": "#690005",
                    "on-secondary-container": "#b4b5b5",
                    "on-tertiary-container": "#2e2925",
                    "on-tertiary": "#342f2b",
                    "on-surface": "#e8e1df",
                    "secondary": "#c6c6c7",
                    "primary-fixed": "#ffdbce",
                    "on-error-container": "#ffdad6",
                    "on-secondary": "#2f3131",
                    "on-background": "#e8e1df",
                    "background": "#151312",
                    "tertiary-container": "#978f8a",
                    "on-primary": "#5a1c00",
                    "inverse-primary": "#a73a00",
                    "tertiary-fixed-dim": "#cec5bf",
                    "secondary-fixed": "#e2e2e2",
                    "tertiary-fixed": "#eae1da",
                    "on-secondary-fixed-variant": "#454747",
                    "inverse-surface": "#e8e1df",
                    "on-secondary-fixed": "#1a1c1c",
                    "on-primary-container": "#4f1700",
                    "inverse-on-surface": "#33302e",
                    "surface": "#151312"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "2xl": "48px",
                "md": "16px",
                "margin-mobile": "20px",
                "gutter": "16px",
                "xs": "4px",
                "xl": "32px",
                "sm": "8px",
                "lg": "24px",
                "margin-desktop": "40px",
                "base": "4px"
            },
            "fontFamily": {
                "body-lg": ["Outfit"],
                "display-lg": ["Outfit"],
                "headline-lg-mobile": ["Outfit"],
                "caption": ["Outfit"],
                "body-md": ["Outfit"],
                "label-md": ["Outfit"],
                "headline-md": ["Outfit"],
                "headline-lg": ["Outfit"]
            }
          }
        }
      }
    </script>
    <style>
        body { background-color: #0C0A09; color: #FFFFFF; font-family: 'Outfit', sans-serif; }
        .bg-surface-card { background-color: #1C1917; }
        .faint-border { border: 1px solid rgba(120, 113, 108, 0.15); }
        .text-muted-sage { color: #78716C; }
        .bg-warm-orange { background-color: #EA580C; }
        .text-warm-orange { color: #EA580C; }
        .border-warm-orange { border-color: #EA580C; }
        .bg-stone-800 { background-color: #292524; }
        body { min-height: 100dvh; }
    </style>
</head>
<body class="min-h-screen flex justify-center font-body-md antialiased pb-24">
    <div class="w-full max-w-[480px] bg-background min-h-screen relative overflow-hidden faint-border flex flex-col">
        <!-- Top AppBar -->
        <header class="bg-surface flex justify-between items-center px-margin-mobile w-full py-md sticky top-0 z-40 border-b faint-border border-b-0">
            <a href="index.html" aria-label="Back" class="w-10 h-10 flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity duration-200">
                <span class="material-symbols-outlined font-light text-[24px]" style="font-variation-settings: 'wght' 200;">arrow_back_ios</span>
            </a>
            <h1 class="font-headline-md text-headline-md font-bold text-on-surface">Saved Recipes</h1>
            <div class="w-10"></div> <!-- Spacer for centering -->
        </header>

        <!-- Main Content -->
        <main class="flex-grow px-margin-mobile pt-lg flex flex-col gap-lg pb-32 overflow-y-auto">
            <!-- Search Bar -->
            <section class="flex flex-col gap-md">
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-muted-sage ml-2">search</span>
                    <input id="search-input" class="w-full bg-surface-card faint-border rounded-xl py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-muted-sage focus:outline-none focus:border-warm-orange focus:ring-1 focus:ring-warm-orange transition-colors" placeholder="Search your saved recipes..." type="text" autocomplete="off"/>
                </div>
            </section>

            <!-- Recipes Grid -->
            <section id="grid-section" class="flex flex-col gap-md flex-grow">
                <div id="saved-grid" class="grid grid-cols-2 gap-4">
                    <!-- Dynamic cards will go here -->
                </div>

                <!-- Empty State Composition -->
                <div id="empty-state" class="hidden flex-grow flex flex-col items-center justify-center gap-4 py-8 mt-12 transition-all">
                    <span class="material-symbols-outlined text-[80px] text-muted-sage/30 animate-pulse" style="font-variation-settings: 'wght' 100;">bookmark</span>
                    <p class="text-muted-sage font-label-md text-sm text-center">No saved recipes yet</p>
                    <a href="index.html" class="bg-warm-orange text-white px-6 py-2.5 rounded-full font-label-md text-label-md font-semibold hover:bg-opacity-90 active:scale-95 transition-all">Find Recipes</a>
                </div>
            </section>
        </main>

        <!-- BottomNavBar (Shared Component) -->
        <nav class="bg-surface-container dark:bg-surface-container font-label-md text-label-md absolute bottom-0 w-full z-50 rounded-t-xl border-t border-outline-variant/15 shadow-lg flex justify-around items-center px-4 py-2 left-0 max-w-[480px]">
            <a href="index.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-warm-orange transition-colors scale-95 active:scale-90 transition-transform w-20">
                <span class="material-symbols-outlined">home</span>
                <span class="font-label-md text-label-md text-[10px] mt-1">Home</span>
            </a>
            <a href="ingredients.html" class="flex flex-col items-center justify-center text-on-surface-variant hover:text-warm-orange transition-colors scale-95 active:scale-90 transition-transform w-20">
                <span class="material-symbols-outlined">kitchen</span>
                <span class="font-label-md text-label-md text-[10px] mt-1">Ingredients</span>
            </a>
            <a href="saved.html" class="flex flex-col items-center justify-center text-warm-orange bg-primary-container/10 rounded-xl px-4 py-1 hover:text-warm-orange transition-colors scale-95 active:scale-90 transition-transform w-20">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bookmark</span>
                <span class="font-label-md text-label-md text-[10px] mt-1 font-bold">Saved</span>
            </a>
        </nav>
    </div>

    <!-- Script logic -->
    <script>
        // Helper to retrieve saved recipes list from localStorage
        function getSavedRecipes() {
            try {
                return JSON.parse(localStorage.getItem("cooksmart_saved")) || [];
            } catch(e) {
                return [];
            }
        }

        // Helper to persist saved recipes list to localStorage
        function saveSavedRecipes(recipes) {
            localStorage.setItem("cooksmart_saved", JSON.stringify(recipes));
        }

        // DOM elements
        const savedGrid = document.getElementById("saved-grid");
        const emptyState = document.getElementById("empty-state");
        const searchInput = document.getElementById("search-input");

        let savedRecipes = getSavedRecipes();

        // Render recipes list with optional text filter
        function renderRecipes(filterText = "") {
            savedGrid.innerHTML = "";
            
            const filtered = savedRecipes.filter(r => 
                r.name.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                if (savedRecipes.length === 0) {
                    emptyState.style.display = "flex";
                    emptyState.classList.remove("hidden");
                    savedGrid.style.display = "none";
                } else {
                    // Search query matches nothing, show zero-results state
                    emptyState.style.display = "none";
                    savedGrid.style.display = "grid";
                    savedGrid.innerHTML = `
                        <div class="col-span-2 text-center py-12 text-muted-sage text-sm font-label-md">
                            No matching saved recipes found.
                        </div>
                    `;
                }
            } else {
                emptyState.style.display = "none";
                savedGrid.style.display = "grid";

                filtered.forEach(recipe => {
                    const card = document.createElement("div");
                    card.className = "bg-surface-card rounded-2xl border border-outline-variant/15 overflow-hidden group cursor-pointer hover:scale-[1.02] active:scale-[0.99] transition-all flex flex-col relative";
                    
                    // Card contents
                    card.innerHTML = `
                        <div class="relative aspect-square overflow-hidden">
                            <img alt="${recipe.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="${recipe.image}"/>
                            <button class="remove-btn absolute top-2 right-2 p-1.5 bg-stone-950/80 backdrop-blur-sm rounded-full text-warm-orange hover:scale-110 active:scale-95 transition-transform z-10" data-id="${recipe.id}">
                                <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">bookmark</span>
                            </button>
                        </div>
                        <div class="p-3 flex-grow flex flex-col justify-between">
                            <h3 class="font-label-md text-label-md text-white font-semibold line-clamp-2 mb-2">${recipe.name}</h3>
                            <div class="flex items-center justify-between text-muted-sage font-caption text-caption">
                                <div class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">schedule</span>
                                    <span>${recipe.time}</span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px] text-warm-orange" style="font-variation-settings: 'FILL' 1;">star</span>
                                    <span>${recipe.rating}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Card click navigation
                    card.addEventListener("click", (e) => {
                        // Prevent navigation if the user clicked on the remove bookmark button
                        if (e.target.closest(".remove-btn")) {
                            return;
                        }
                        window.location.href = `recipe.html?recipeId=${recipe.id}`;
                    });

                    // Wire bookmark remove button click
                    card.querySelector(".remove-btn").addEventListener("click", (e) => {
                        e.stopPropagation();
                        removeRecipe(recipe.id);
                    });

                    savedGrid.appendChild(card);
                });
            }
        }

        // Remove recipe from bookmarks
        function removeRecipe(id) {
            savedRecipes = savedRecipes.filter(r => r.id !== id);
            saveSavedRecipes(savedRecipes);
            
            // Clean custom recipe in storage if applicable
            if (id.startsWith("custom_")) {
                localStorage.removeItem(`custom-recipe-${id}`);
            }

            renderRecipes(searchInput.value);
        }

        // Bind search filter
        searchInput.addEventListener("input", (e) => {
            renderRecipes(e.target.value);
        });

        // Initial render
        renderRecipes();
    </script>
</body>
</html>
