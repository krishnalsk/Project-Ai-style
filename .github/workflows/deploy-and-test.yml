name: Deploy & Web E2E Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Stage 1: Build & Static Analysis
  build-and-lint:
    name: Build & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'style-ai-web/package-lock.json'

      - name: Install Web Dependencies
        run: |
          cd style-ai-web
          npm ci

      - name: Run Static Analysis & Linter
        run: |
          cd style-ai-web
          npm run lint

      - name: Build Production Static Export
        env:
          NEXT_PUBLIC_BASE_PATH: '/Project-Ai-style'
          STATIC_EXPORT: 'true'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'AIzaSyBOGlzguQMfC49b9xo1HfcsXNuNpuLJxeY' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'best-3-52312.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'best-3-52312' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'best-3-52312.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '354741162304' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:354741162304:android:8aec986a11739c8a5b6aa5' }}
        run: |
          cd style-ai-web
          npm run build
          touch out/.nojekyll
          cp out/index.html out/404.html 2>/dev/null || true

      - name: Upload Static Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-build
          path: style-ai-web/out
          retention-days: 7

  # Stage 2: Deploy to GitHub Pages
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-build
          path: out

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Package
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          keep_files: false

  # Stage 3: Verify Live Deployment & Run Selenium E2E
  verify-and-test:
    name: Verify Live URL & Run Selenium E2E
    needs: [deploy-pages]
    if: always() && (needs.deploy-pages.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait & Verify Live Deployment Status
        env:
          LIVE_URL: ${{ vars.WEB_DEPLOYMENT_URL || 'https://krishnalsk.github.io/Project-Ai-style/' }}
        run: |
          echo "Verifying live deployment at: $LIVE_URL"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$LIVE_URL" || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Live site is healthy and responsive."
              break
            fi
            sleep 5
          done

      - name: Install Test Dependencies
        run: |
          cd selenium-tests
          npm ci || npm install

      - name: Execute Selenium Headless Chrome Suite
        env:
          WEB_DEPLOYMENT_URL: ${{ vars.WEB_DEPLOYMENT_URL || 'https://krishnalsk.github.io/Project-Ai-style/' }}
        run: |
          cd style-ai-web
          node testing-automation/run-all.js

      - name: Upload Test Reports & Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results-Artifacts
          path: Test Results/
          retention-days: 30

      - name: Publish GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Web Testing Completed" >> $GITHUB_STEP_SUMMARY
          fi
