name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Selenium Web Tests
  selenium-web-tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run Selenium E2E Web Tests
      env:
        CI: 'true'
      run: |
        cd selenium-tests
        npm install
        node run-tests.js
    - name: Upload Selenium Reports
      uses: actions/upload-artifact@v4
      with:
        name: selenium-web-report
        path: |
          selenium-tests/selenium_test_report.xlsx
          selenium-tests/execution-report.html

  # 2. Appium Mobile Tests
  appium-mobile-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run Appium Mobile Simulation Tests
      env:
        CI: 'true'
      run: |
        cd appium-tests
        npm install
        node run-tests.js
    - name: Upload Appium Reports
      uses: actions/upload-artifact@v4
      with:
        name: appium-mobile-report
        path: |
          appium-tests/appium_test_report.xlsx
          appium-tests/execution-report.html

  # 3. Load Tests (100 VUs x 60s Simulation)
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run Load Tests (100 VUs x 60s)
      env:
        CI: 'true'
      run: |
        cd load-tests
        npm install
        node run-load-tests.js
    - name: Upload Load Testing Report
      uses: actions/upload-artifact@v4
      with:
        name: load-testing-report
        path: load-tests/load_test_report.xlsx

  # 4. DAST Security Tests
  dast-security-tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run SAST + DAST Security Audit (Zero-Critical Gate)
      env:
        CI: 'true'
      run: |
        cd dast-tests
        npm install
        node run-security-scans.js
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: dast-security-report
        path: |
          dast-tests/security_findings.xlsx
          dast-tests/executive-summary.md

  # 5. Bundle Reports
  bundle-reports:
    name: Bundle Reports
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-mobile-tests, load-tests, dast-security-tests]
    steps:
    - name: Create Reports Directory
      run: mkdir -p bundled-reports
    - name: Download Selenium Report
      uses: actions/download-artifact@v4
      with:
        name: selenium-web-report
        path: bundled-reports/
    - name: Download Appium Report
      uses: actions/download-artifact@v4
      with:
        name: appium-mobile-report
        path: bundled-reports/
    - name: Download Load Report
      uses: actions/download-artifact@v4
      with:
        name: load-testing-report
        path: bundled-reports/
    - name: Download DAST Report
      uses: actions/download-artifact@v4
      with:
        name: dast-security-report
        path: bundled-reports/
    - name: List Bundled Reports
      run: ls -la bundled-reports/
    - name: Upload Bundled Reports Package
      uses: actions/upload-artifact@v4
      with:
        name: Test-Execution-Reports-Bundle
        path: bundled-reports/

  # 6. Deploy
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: bundle-reports
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download All Bundled Reports
      uses: actions/download-artifact@v4
      with:
        name: Test-Execution-Reports-Bundle
        path: bundled-reports/

    - name: Inject Firebase Env Config
      run: |
        cat <<EOF > style-ai-web/.env.local
        NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || 'AIzaSyBOGlzguQMfC49b9xo1HfcsXNuNpuLJxeY' }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || 'best-3-52312.firebaseapp.com' }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'best-3-52312' }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || 'best-3-52312.firebasestorage.app' }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '354741162304' }}
        NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '1:354741162304:android:8aec986a11739c8a5b6aa5' }}
        EOF

    - name: Build Next.js Production Static Website
      env:
        NEXT_PUBLIC_BASE_PATH: '/Project-Ai-style'
      run: |
        cd style-ai-web
        npm install
        npm run build

    - name: Inject Quality Reports Hub & GitHub Pages Routing Fixes
      run: |
        mkdir -p style-ai-web/out/reports
        cp -r bundled-reports/* style-ai-web/out/reports/ 2>/dev/null || true
        touch style-ai-web/out/.nojekyll
        cp style-ai-web/out/index.html style-ai-web/out/404.html 2>/dev/null || true

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: style-ai-web/out

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
