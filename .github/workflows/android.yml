name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Create Google Services JSON file
      run: |
        cat <<EOF > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789",
            "project_id": "dummy-project-id",
            "storage_bucket": "dummy-storage-bucket"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:123456789abcdef",
                "android_client_info": {
                  "package_name": "com.example.best3"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "dummy-api-key"
                }
              ],
              "services": {
                "appinvite_service": {
                  "status": 1
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug
